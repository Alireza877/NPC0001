name: Send Telegram Message

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual triggering of the workflow

jobs:
  send_message:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grant permission to commit and push changes

    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run the script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
      run: python send_telegram_message.py

    - name: Commit and Push Changes
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "github-actions@github.com"
        git add messages.txt
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit, file was likely empty or script failed."
        else
          git commit -m "chore(bot): Update messages.txt after sending message"
          git push
        fi
